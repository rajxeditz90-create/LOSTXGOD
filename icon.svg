<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Neon Border Ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#06b6d4" stroke-width="4" stroke-opacity="0.3" />

  <!-- Shield Base -->
  <path d="M 256 70 L 390 130 C 390 280 256 390 256 420 C 256 390 122 280 122 130 Z" 
        fill="#0b1120" stroke="url(#shieldGrad)" stroke-width="12" stroke-linejoin="round" filter="url(#neonGlow)" />

  <!-- Inner Cyber Core -->
  <path d="M 256 95 L 365 145 C 365 265 256 355 256 385 C 256 355 147 265 147 145 Z" 
        fill="#0f172a" stroke="#06b6d4" stroke-width="3" stroke-dasharray="8 6" stroke-opacity="0.6" />

  <!-- Central Lightning Bolt (Bot Power) -->
  <path d="M 270 140 L 195 260 L 250 260 L 235 365 L 325 240 L 270 240 Z" 
        fill="url(#boltGrad)" filter="url(#neonGlow)" />

  <!-- Lettering Accent -->
  <text x="256" y="465" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" letter-spacing="4">LOST GOD</text>
</svg>
